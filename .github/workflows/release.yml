name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# POLICY: first-party GitHub-org actions only; publishing uses the runner's
# pre-installed `gh` CLI.

jobs:
  # A tag ships only code that passes every CI gate.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write: it creates the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The .min siblings are git-ignored build output; they must exist
      # before the tree is zipped.
      - name: Build minified assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build zip
        # .distignore is the single list of dev-only paths. The directory
        # must be named `lafka`: the child theme declares `Template: lafka`.
        run: |
          mkdir lafka
          rsync -a --exclude-from=.distignore ./ lafka/
          zip -qr lafka.zip lafka/
          sha256sum lafka.zip > lafka.zip.sha256
          cat lafka.zip.sha256

      # The GitHub updater looks for the asset name `lafka.zip`.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" lafka.zip lafka.zip.sha256 --clobber
